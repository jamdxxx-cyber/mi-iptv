name: Actualizar lista IPTV

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Ejecutar actualización
        run: python actualizar.py

      - name: Guardar cambios
        run: |
          git config user.name "iptv-bot"
          git config user.email "iptv-bot@users.noreply.github.com"
          git add canales_por_pais.m3u
          git diff --cached --quiet || git commit -m "Actualizar lista IPTV"
          git push
